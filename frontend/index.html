<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPZ Opportunities</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">TRPZ Opportunities</div>
            <div class="nav-links" id="navLinks">
                <a href="#" onclick="showPage('opportunities')">Можливості</a>
                <a href="#" onclick="showPage('roadmap')">Roadmap</a>
                <a href="#" onclick="showPage('profile')" id="profileLink">Профіль</a>
                <span id="userGreeting"></span>
                <button onclick="logout()" id="logoutBtn" class="btn btn-secondary">Вийти</button>
            </div>
            <div class="auth-links" id="authLinks">
                <button onclick="showPage('login')" class="btn btn-primary">Увійти</button>
                <button onclick="showPage('register')" class="btn btn-secondary">Реєстрація</button>
            </div>
        </nav>
    </header>

    <main>
        <!-- Login Page -->
        <div id="loginPage" class="page">
            <div class="form-container">
                <h2>Вхід</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" name="password" required>
                    </div>
                    <div id="loginError" class="error"></div>
                    <button type="submit" class="btn btn-primary">Увійти</button>
                </form>
                <p>Немає акаунту? <a href="#" onclick="showPage('register')">Зареєструватися</a></p>
            </div>
        </div>

        <!-- Register Page -->
        <div id="registerPage" class="page">
            <div class="form-container">
                <h2>Реєстрація</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Ім'я:</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль:</label>
                        <input type="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label>Регіон:</label>
                        <select name="region" required>
                            <option value="">Оберіть регіон</option>
                            <option value="Київ">Київ</option>
                            <option value="Львів">Львів</option>
                            <option value="Харків">Харків</option>
                            <option value="Одеса">Одеса</option>
                            <option value="Дніпро">Дніпро</option>
                            <option value="Інший">Інший</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Рівень освіти:</label>
                        <select name="educationLevel" required>
                            <option value="">Оберіть рівень освіти</option>
                            <option value="Середня">Середня</option>
                            <option value="Бакалавр">Бакалавр</option>
                            <option value="Магістр">Магістр</option>
                            <option value="Доктор наук">Доктор наук</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Інтереси:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="interests" value="Технології"> Технології</label>
                            <label><input type="checkbox" name="interests" value="Спорт"> Спорт</label>
                            <label><input type="checkbox" name="interests" value="Мистецтво"> Мистецтво</label>
                            <label><input type="checkbox" name="interests" value="Наука"> Наука</label>
                            <label><input type="checkbox" name="interests" value="Подорожі"> Подорожі</label>
                            <label><input type="checkbox" name="interests" value="Музика"> Музика</label>
                            <label><input type="checkbox" name="interests" value="Кіно"> Кіно</label>
                            <label><input type="checkbox" name="interests" value="Книги"> Книги</label>
                        </div>
                    </div>
                    <div id="registerError" class="error"></div>
                    <button type="submit" class="btn btn-primary">Зареєструватися</button>
                </form>
                <p>Вже є акаунт? <a href="#" onclick="showPage('login')">Увійти</a></p>
            </div>
        </div>

        <!-- Profile Page -->
        <div id="profilePage" class="page">
            <div class="form-container">
                <h2>Мій профіль</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label>Ім'я:</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" name="email" disabled>
                    </div>
                    <div class="form-group">
                        <label>Регіон:</label>
                        <select name="region" required>
                            <option value="Київ">Київ</option>
                            <option value="Львів">Львів</option>
                            <option value="Харків">Харків</option>
                            <option value="Одеса">Одеса</option>
                            <option value="Дніпро">Дніпро</option>
                            <option value="Інший">Інший</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Рівень освіти:</label>
                        <select name="educationLevel" required>
                            <option value="Середня">Середня</option>
                            <option value="Бакалавр">Бакалавр</option>
                            <option value="Магістр">Магістр</option>
                            <option value="Доктор наук">Доктор наук</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Інтереси:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="interests" value="Технології"> Технології</label>
                            <label><input type="checkbox" name="interests" value="Спорт"> Спорт</label>
                            <label><input type="checkbox" name="interests" value="Мистецтво"> Мистецтво</label>
                            <label><input type="checkbox" name="interests" value="Наука"> Наука</label>
                            <label><input type="checkbox" name="interests" value="Подорожі"> Подорожі</label>
                            <label><input type="checkbox" name="interests" value="Музика"> Музика</label>
                            <label><input type="checkbox" name="interests" value="Кіно"> Кіно</label>
                            <label><input type="checkbox" name="interests" value="Книги"> Книги</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Аватар:</label>
                        <input type="file" name="avatar" accept="image/*">
                    </div>
                    <div id="profileMessage" class="message"></div>
                    <button type="submit" class="btn btn-primary">Оновити профіль</button>
                </form>
            </div>
        </div>

        <!-- Roadmap Page -->
        <div id="roadmapPage" class="page">
            <div class="page-header">
                <h1>Career Roadmap</h1>
                <button onclick="generateRoadmap()" class="btn btn-primary">Генерувати Roadmap</button>
            </div>
            
            <div class="roadmap-form">
                <div class="form-group">
                    <label>Оберіть кар'єрний шлях:</label>
                    <select id="careerPath">
                        <option value="">Оберіть...</option>
                        <option value="frontend-developer">Frontend Developer</option>
                        <option value="backend-developer">Backend Developer</option>
                        <option value="fullstack-developer">Fullstack Developer</option>
                        <option value="data-scientist">Data Scientist</option>
                        <option value="devops-engineer">DevOps Engineer</option>
                        <option value="mobile-developer">Mobile Developer</option>
                        <option value="ui-ux-designer">UI/UX Designer</option>
                        <option value="product-manager">Product Manager</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Поточний рівень:</label>
                    <select id="currentLevel">
                        <option value="beginner">Початківець</option>
                        <option value="intermediate">Середній</option>
                        <option value="advanced">Просунутий</option>
                    </select>
                </div>
            </div>

            <div id="roadmapContent" class="roadmap-content">
                <div class="roadmap-placeholder">
                    <p>Оберіть кар'єрний шлях та натисніть "Генерувати Roadmap" для отримання персоналізованого плану розвитку.</p>
                </div>
            </div>
        </div>

        <!-- Opportunities Page -->
        <div id="opportunitiesPage" class="page">
            <div class="page-header">
                <h1>Можливості</h1>
                <button onclick="triggerParsing()" class="btn btn-secondary">Оновити дані</button>
            </div>
            
            <div class="filters">
                <div class="filters-row">
                    <div class="filter-group">
                        <label>Тип:</label>
                        <select id="typeFilter">
                            <option value="">Всі типи</option>
                            <option value="job">Робота</option>
                            <option value="course">Курси</option>
                            <option value="news">Новини</option>
                            <option value="project">Проекти</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Регіон:</label>
                        <input type="text" id="regionFilter" placeholder="Введіть регіон">
                    </div>
                    <div class="filter-group">
                        <label>Теги:</label>
                        <input type="text" id="tagsFilter" placeholder="Введіть тег">
                    </div>
                    <button onclick="loadOpportunities()" class="btn btn-primary">Фільтрувати</button>
                </div>
            </div>

            <div id="opportunitiesGrid" class="opportunities-grid">
                <div class="loading">Завантаження...</div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/roadmap.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
