version: '3'

services:
  # Backend service for opportunities
  opportunities:
    build:
      context: ./back/opportunities
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    env_file:
      - ./back/opportunities/.env
    environment:
      # Override MONGODB_URI to point to the Docker container
      - MONGODB_URI=mongodb://mongo:27017/opportunities
    volumes:
      # Mount the application code for development
      - ./back/opportunities:/app
      # Use a named volume for node_modules to avoid overwriting
      - /app/node_modules
    restart: unless-stopped

  # MongoDB database
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      # Persist MongoDB data
      - mongo-data:/data/db
    restart: unless-stopped

# Named volumes
volumes:
  mongo-data:
