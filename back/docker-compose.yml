version: '3.8'

services:
  # User Authentication Service
  user-auth:
    build: ./user-auth
    ports:
      - "3001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/user-auth
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRE=7d
    depends_on:
      - mongo
    volumes:
      - ./user-auth:/app
      - /app/node_modules
    restart: unless-stopped

  # Opportunities Service
  opportunities:
    build: ./opportunities
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/opportunities
    depends_on:
      - mongo
    volumes:
      - ./opportunities:/app
      - /app/node_modules
    restart: unless-stopped

  # MongoDB Database (shared)
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-auth
      - opportunities
    restart: unless-stopped

volumes:
  mongo_data: