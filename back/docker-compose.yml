services:
  user-auth:
    build: ./user-auth
    ports:
      - "3001:5000"
    environment:
      NODE_ENV: ${AUTH_NODE_ENV}
      PORT: 5000
      MONGODB_URI: mongodb://mongo:${DB_PORT}/user-auth
      JWT_SECRET: ${AUTH_JWT_SECRET}
      JWT_EXPIRE: ${AUTH_JWT_EXPIRE}

    depends_on:
      - mongo
    volumes:
      - ./user-auth:/app
      - /app/node_modules
    restart: unless-stopped

  opportunities:
    build: ./opportunities
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      HOST: ${OPPORTUNITIES_HOST}
      MONGODB_URI: mongodb://mongo:${DB_PORT}/opportunities
      NEWS_API_KEY: ${OPPORTUNITIES_NEWS_API_KEY}
      CRON_SCHEDULE: ${OPPORTUNITIES_CRON_SCHEDULE}
    depends_on:
      - mongo
    volumes:
      - ./opportunities:/app
      - /app/node_modules
    restart: unless-stopped

  roadmap:
    build: ./roadmap
    ports:
      - "3003:4000"
    environment:
      PORT: ${ROADMAP_PORT}
      MONGODB_URI: mongodb://mongo:${DB_PORT}/roadmap
      USER_AUTH_URL: http://user-auth:5000/auth
      OPPORTUNITIES_URL: http://opportunities:3000/opportunities
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      - mongo
      - opportunities
      - user-auth
    volumes:
      - ./roadmap:/app
      - /app/node_modules
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "${DB_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-auth
      - opportunities
    restart: unless-stopped

volumes:
  mongo_data: